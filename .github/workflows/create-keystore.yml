name: Imzo kaliti yasash (bir marta)

# BU WORKFLOW FAQAT BIR MARTA ISHGA TUSHIRILADI.
# U imzo kalitini yasaydi va base64 ko'rinishida beradi.
# Chiqqan matnni GitHub Secrets'ga saqlaganingizdan keyin
# bu workflow boshqa kerak bo'lmaydi.

on:
  workflow_dispatch:
    inputs:
      key_password:
        description: "Kalit uchun parol (kamida 6 belgi, eslab qoling!)"
        required: true
      alias:
        description: "Kalit nomi (alias)"
        required: true
        default: "unutilmastam"

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Kalit yasash
        env:
          PW:    ${{ inputs.key_password }}
          ALIAS: ${{ inputs.alias }}
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=Unutilmas Tam, OU=ITcoDe, O=Unutilmas Tam, L=Denov, ST=Surxondaryo, C=UZ"
          base64 -w0 release.keystore > keystore.base64.txt
          echo "Kalit yasaldi. Hajmi:"
          ls -lh release.keystore

      - name: Natijani chiqarish
        uses: actions/upload-artifact@v4
        with:
          name: IMZO-KALITI-SAQLANG
          path: |
            release.keystore
            keystore.base64.txt
          retention-days: 7
