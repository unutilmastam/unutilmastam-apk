name: Unutilmas Tam - APK yasash

# ═══════════════════════════════════════════════════════════════
#  BITTA FAYL — butun Android loyihasi shu yerda.
#  Boshqa hech qanday papka yoki fayl yuklash SHART EMAS.
#
#  ISHLATISH:
#   1) Actions > bu workflow > Run workflow
#   2) Nima qilish? -> "kalit"  (birinchi marta, bir martagina)
#   3) Chiqqan base64 matnni Secrets'ga saqlang
#   4) Yana Run workflow -> "apk"
# ═══════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      nima:
        description: "Nima qilamiz?"
        required: true
        default: apk
        type: choice
        options: [apk, kalit]
      parol:
        description: "Faqat 'kalit' uchun: yangi parol (kamida 6 belgi)"
        required: false
        default: ""
      versiya:
        description: "Ilova versiyasi (masalan 1.0)"
        required: false
        default: "1.0"
      versiya_kodi:
        description: "Versiya kodi (har yangi APK da 1 ga oshiring)"
        required: false
        default: "1"

jobs:

  # ─────────── 1-ISH: imzo kalitini yasash (bir marta) ───────────
  kalit:
    if: inputs.nima == 'kalit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - name: Parolni tekshirish
        run: |
          if [ ${#PAROL} -lt 6 ]; then
            echo "::error::Parol kamida 6 belgi bo'lishi kerak. Run workflow'da 'parol' maydonini to'ldiring."
            exit 1
          fi
        env:
          PAROL: ${{ inputs.parol }}

      - name: Kalit yasash
        env:
          PAROL: ${{ inputs.parol }}
        run: |
          keytool -genkeypair -v -keystore release.keystore \
            -alias unutilmastam -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PAROL" -keypass "$PAROL" \
            -dname "CN=Unutilmas Tam, O=Unutilmas Tam, L=Denov, C=UZ"
          base64 -w0 release.keystore > KEYSTORE_BASE64.txt
          echo "======================================================"
          echo " Kalit tayyor. Endi Settings > Secrets ga qo'shing:"
          echo "   KEYSTORE_BASE64   -> KEYSTORE_BASE64.txt ichidagi matn"
          echo "   KEYSTORE_PASSWORD -> siz kiritgan parol"
          echo "   KEY_PASSWORD      -> o'sha parol"
          echo "   KEY_ALIAS         -> unutilmastam"
          echo "======================================================"

      - uses: actions/upload-artifact@v4
        with:
          name: IMZO-KALITI-YAXSHILAB-SAQLANG
          path: |
            release.keystore
            KEYSTORE_BASE64.txt
          retention-days: 7

  # ─────────── 2-ISH: APK yig'ish ───────────
  apk:
    if: inputs.nima == 'apk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }

      - name: Loyihani yaratish
        working-directory: ${{ runner.temp }}
        run: |
          set -e
          mkdir -p proj && cd proj
          cat > settings.gradle << 'ENDOFFILE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Unutilmas Ta'm"
          include ':app'
          ENDOFFILE
          cat > build.gradle << 'ENDOFFILE'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          ENDOFFILE
          cat > gradle.properties << 'ENDOFFILE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.caching=true
          ENDOFFILE
          mkdir -p app
          cat > app/build.gradle << 'ENDOFFILE'
          plugins { id 'com.android.application' }

          android {
              namespace 'uz.unutilmastam.app'
              compileSdk 34

              defaultConfig {
                  applicationId "uz.unutilmastam.app"
                  minSdk 23              // Android 6.0 va yuqorisi
                  targetSdk 34
                  versionCode 1          // Har yangi versiyada 1 ga oshiring
                  versionName "1.0"
              }

              signingConfigs {
                  release {
                      // Qiymatlar GitHub Secrets'dan keladi (workflow ichida beriladi)
                      def ksFile = System.getenv("KEYSTORE_FILE")
                      if (ksFile != null) {
                          storeFile file(ksFile)
                          storePassword System.getenv("KEYSTORE_PASSWORD")
                          keyAlias System.getenv("KEY_ALIAS")
                          keyPassword System.getenv("KEY_PASSWORD")
                      }
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          configurations.all {
            resolutionStrategy {
              // TUZATISH: Kotlin kutubxonasi bitta versiyaga keltiriladi.
              // Aks holda kotlin-stdlib 1.8.22 va kotlin-stdlib-jdk7/jdk8 1.6.21
              // bir xil sinflarni olib keladi -> "Duplicate class" xatosi.
              force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
              force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
              force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
            }
          }

          dependencies {
              implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.activity:activity:1.9.2'
          }
          ENDOFFILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />

              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.location" android:required="false" />

              <!-- Telegram/telefon havolalarini ochish uchun -->
              <queries>
                  <intent><action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" /></intent>
                  <intent><action android:name="android.intent.action.VIEW" />
                      <data android:scheme="tel" /></intent>
                  <intent><action android:name="android.intent.action.SEND" />
                      <data android:mimeType="*/*" /></intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false"
                  android:hardwareAccelerated="true"
                  android:theme="@style/Theme.UnutilmasTam">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode"
                      android:launchMode="singleTask"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize"
                      android:theme="@style/Theme.UnutilmasTam.Splash">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          ENDOFFILE
          mkdir -p app/src/main/java/uz/unutilmastam/app
          cat > app/src/main/java/uz/unutilmastam/app/MainActivity.java << 'ENDOFFILE'
          package uz.unutilmastam.app;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.content.ActivityNotFoundException;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Bitmap;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.view.View;
          import android.webkit.CookieManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import androidx.activity.OnBackPressedCallback;
          import androidx.annotation.NonNull;
          import androidx.annotation.Nullable;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          import java.io.OutputStream;

          /**
           * "Unutilmas Ta'm" — Android WebView ilovasi.
           *
           * Ilova saytni ko'rsatadi, lekin quyidagilar alohida sozlangan:
           *   • Kamera       — QR kod skanerlash uchun (getUserMedia)
           *   • Joylashuv    — yetkazib berish manzili uchun
           *   • Fayl tanlash — mahsulot rasmini yuklash uchun
           *   • Yuklab olish — chek PDF/rasm (blob: manzillar uchun maxsus ko'prik)
           *   • Tashqi havolalar (Telegram, telefon) tashqi ilovada ochiladi
           */
          public class MainActivity extends AppCompatActivity {

              /** Ilova manzili — o'zgartirsangiz, AndroidManifest'dagi host'ni ham o'zgartiring. */
              private static final String SITE_URL = "https://unutilmastam.uz/";
              private static final String SITE_HOST = "unutilmastam.uz";

              private static final int REQ_PERMS = 1001;
              private static final int REQ_FILE = 1002;

              private WebView web;
              private ValueCallback<Uri[]> filePathCallback;
              private PermissionRequest pendingWebPermission;

              @Override
              protected void onCreate(@Nullable Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  web = findViewById(R.id.webview);
                  configureWebView();

                  // Boshlanish paytida ruxsatlarni so'raymiz (kamera, joylashuv)
                  requestAppPermissions();

                  if (savedInstanceState != null) {
                      web.restoreState(savedInstanceState);
                  } else {
                      web.loadUrl(SITE_URL);
                  }

                  // "Orqaga" tugmasi — avval sayt ichida orqaga qaytadi
                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override public void handleOnBackPressed() {
                          if (web.canGoBack()) web.goBack();
                          else finish();
                      }
                  });
              }

              @SuppressLint("SetJavaScriptEnabled")
              private void configureWebView() {
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);              // localStorage — ilova ma'lumotlari shu yerda
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);
                  s.setSupportZoom(false);
                  s.setGeolocationEnabled(true);             // xarita va yetkazib berish uchun
                  s.setMediaPlaybackRequiresUserGesture(false);  // kamera darhol ishga tushsin
                  s.setJavaScriptCanOpenWindowsAutomatically(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
                  // Internet bo'lmasa keshdan o'qiydi — service worker bilan birga offline ishlaydi
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(web, true);

                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);  // saytning o'z "tortib yangilash"iga xalaqit bermasin
                  web.addJavascriptInterface(new FileBridge(), "AndroidBridge");

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest req) {
                          return handleUrl(req.getUrl());
                      }

                      @Override
                      public void onPageFinished(WebView v, String url) {
                          // Saytga "men Android ilovasidaman" deb bildiramiz —
                          // shunda chek yuklab olish ko'prik orqali ishlaydi.
                          v.evaluateJavascript("window.__isAndroidApp = true;", null);
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      /** Kamera/mikrofon so'rovi (QR skanerlash) */
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> {
                              if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.CAMERA)
                                      == PackageManager.PERMISSION_GRANTED) {
                                  request.grant(request.getResources());
                              } else {
                                  pendingWebPermission = request;
                                  ActivityCompat.requestPermissions(MainActivity.this,
                                          new String[]{Manifest.permission.CAMERA}, REQ_PERMS);
                              }
                          });
                      }

                      /** Joylashuv so'rovi */
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin,
                                                                     GeolocationPermissions.Callback cb) {
                          boolean ok = ContextCompat.checkSelfPermission(MainActivity.this,
                                  Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED;
                          cb.invoke(origin, ok, false);
                          if (!ok) requestAppPermissions();
                      }

                      /** Fayl tanlash (mahsulot rasmi, kuryer surati) */
                      @Override
                      public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb,
                                                       FileChooserParams params) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = cb;
                          try {
                              Intent i = params.createIntent();
                              i.addCategory(Intent.CATEGORY_OPENABLE);
                              startActivityForResult(Intent.createChooser(i, "Fayl tanlang"), REQ_FILE);
                              return true;
                          } catch (ActivityNotFoundException e) {
                              filePathCallback = null;
                              toast("Fayl tanlash oynasi ochilmadi");
                              return false;
                          }
                      }
                  });

                  // Oddiy yuklab olish (blob: bo'lmagan havolalar)
                  web.setDownloadListener((url, agent, disposition, mime, size) -> {
                      if (url.startsWith("blob:")) return;   // blob: — ko'prik orqali hal qilinadi
                      try {
                          startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                      } catch (Exception e) {
                          toast("Yuklab olishda xato");
                      }
                  });
              }

              /** Telegram, telefon, pochta havolalari tashqi ilovada ochilsin */
              private boolean handleUrl(Uri uri) {
                  String scheme = uri.getScheme() == null ? "" : uri.getScheme();
                  String host = uri.getHost() == null ? "" : uri.getHost();

                  if (host.equals(SITE_HOST) || host.equals("www." + SITE_HOST)) return false;

                  if (scheme.equals("http") || scheme.equals("https")
                          || scheme.equals("tel") || scheme.equals("mailto")
                          || scheme.equals("sms") || scheme.equals("intent")
                          || scheme.equals("tg") || scheme.equals("geo")) {
                      try {
                          startActivity(new Intent(Intent.ACTION_VIEW, uri));
                          return true;
                      } catch (ActivityNotFoundException e) {
                          toast("Bu havolani ochadigan ilova topilmadi");
                          return true;
                      }
                  }
                  return false;
              }

              /**
               * JavaScript ko'prigi — chekni (PDF/rasm) telefon xotirasiga saqlaydi.
               * Sayt tomonida blob base64 ga aylantirilib shu yerga uzatiladi.
               */
              private class FileBridge {
                  @JavascriptInterface
                  public void saveFile(String base64Data, String fileName, String mimeType) {
                      runOnUiThread(() -> {
                          try {
                              byte[] bytes = Base64.decode(base64Data, Base64.DEFAULT);
                              Uri saved = writeToDownloads(bytes, fileName, mimeType);
                              if (saved == null) { toast("Saqlab bo'lmadi"); return; }
                              toast("Saqlandi: " + fileName);

                              // Darhol ulashish taklifi (Telegram, WhatsApp...)
                              Intent share = new Intent(Intent.ACTION_SEND);
                              share.setType(mimeType);
                              share.putExtra(Intent.EXTRA_STREAM, saved);
                              share.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                              startActivity(Intent.createChooser(share, "Ulashish"));
                          } catch (Exception e) {
                              toast("Xato: " + e.getMessage());
                          }
                      });
                  }
              }

              private Uri writeToDownloads(byte[] bytes, String name, String mime) {
                  try {
                      ContentValues cv = new ContentValues();
                      cv.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                      cv.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                      Uri collection;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          cv.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                          collection = MediaStore.Downloads.EXTERNAL_CONTENT_URI;
                      } else {
                          collection = MediaStore.Files.getContentUri("external");
                      }
                      Uri item = getContentResolver().insert(collection, cv);
                      if (item == null) return null;
                      try (OutputStream out = getContentResolver().openOutputStream(item)) {
                          if (out == null) return null;
                          out.write(bytes);
                      }
                      return item;
                  } catch (Exception e) {
                      return null;
                  }
              }

              private void requestAppPermissions() {
                  String[] perms = {
                          Manifest.permission.CAMERA,
                          Manifest.permission.ACCESS_FINE_LOCATION,
                          Manifest.permission.ACCESS_COARSE_LOCATION
                  };
                  boolean need = false;
                  for (String p : perms) {
                      if (ContextCompat.checkSelfPermission(this, p) != PackageManager.PERMISSION_GRANTED) {
                          need = true; break;
                      }
                  }
                  if (need) ActivityCompat.requestPermissions(this, perms, REQ_PERMS);
              }

              @Override
              public void onRequestPermissionsResult(int code, @NonNull String[] perms, @NonNull int[] res) {
                  super.onRequestPermissionsResult(code, perms, res);
                  if (code == REQ_PERMS && pendingWebPermission != null) {
                      boolean granted = res.length > 0 && res[0] == PackageManager.PERMISSION_GRANTED;
                      if (granted) pendingWebPermission.grant(pendingWebPermission.getResources());
                      else pendingWebPermission.deny();
                      pendingWebPermission = null;
                  }
              }

              @Override
              protected void onActivityResult(int req, int result, @Nullable Intent data) {
                  super.onActivityResult(req, result, data);
                  if (req == REQ_FILE) {
                      if (filePathCallback == null) return;
                      Uri[] uris = null;
                      if (result == RESULT_OK && data != null) {
                          if (data.getClipData() != null) {
                              int n = data.getClipData().getItemCount();
                              uris = new Uri[n];
                              for (int i = 0; i < n; i++) uris[i] = data.getClipData().getItemAt(i).getUri();
                          } else if (data.getData() != null) {
                              uris = new Uri[]{data.getData()};
                          }
                      }
                      filePathCallback.onReceiveValue(uris);
                      filePathCallback = null;
                  }
              }

              @Override protected void onSaveInstanceState(@NonNull Bundle out) {
                  super.onSaveInstanceState(out);
                  web.saveState(out);
              }

              @Override protected void onPause()  { web.onPause();  super.onPause(); }
              @Override protected void onResume() { super.onResume(); web.onResume(); }

              private void toast(String m) { Toast.makeText(this, m, Toast.LENGTH_SHORT).show(); }
          }
          ENDOFFILE
          mkdir -p app/src/main/res/layout
          cat > app/src/main/res/layout/activity_main.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/brand_bg"
              android:fitsSystemWindows="true">

              <WebView
                  android:id="@+id/webview"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />
          </FrameLayout>
          ENDOFFILE
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml << 'ENDOFFILE'
          <resources>
              <string name="app_name">Unutilmas Ta\'m</string>
          </resources>
          ENDOFFILE
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/colors.xml << 'ENDOFFILE'
          <resources>
              <color name="brand">#EA4E2A</color>
              <color name="brand_dark">#C43C14</color>
              <color name="brand_bg">#F5F1EA</color>
          </resources>
          ENDOFFILE
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/themes.xml << 'ENDOFFILE'
          <resources>
              <style name="Theme.UnutilmasTam" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:statusBarColor">@color/brand_bg</item>
                  <item name="android:navigationBarColor">@color/brand_bg</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>

              <style name="Theme.UnutilmasTam.Splash" parent="Theme.UnutilmasTam">
                  <item name="android:windowBackground">@drawable/splash_screen</item>
                  <item name="android:statusBarColor">@color/brand</item>
                  <item name="android:navigationBarColor">@color/brand</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          ENDOFFILE
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/splash_screen.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="rectangle">
                      <gradient android:type="radial"
                          android:centerX="0.5" android:centerY="0.0"
                          android:gradientRadius="900"
                          android:startColor="#FF8A3C"
                          android:centerColor="#EA4E2A"
                          android:endColor="#C43C14" />
                  </shape>
              </item>
              <item>
                  <bitmap android:src="@mipmap/ic_launcher" android:gravity="center" />
              </item>
          </layer-list>
          ENDOFFILE
          # Versiya raqamlarini qo'yamiz
          sed -i "s/versionCode 1/versionCode ${{ inputs.versiya_kodi }}/" app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${{ inputs.versiya }}\"/" app/build.gradle
          echo "--- yaratilgan fayllar ---"
          find . -type f | sort

      - name: Ikonkalarni saytdan olish
        working-directory: ${{ runner.temp }}/proj
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          curl -fsSL -o base.png "https://unutilmastam.uz/icon-512.png" || \
          curl -fsSL -o base.png "https://unutilmastam.uz/apple-touch-icon.png"
          for pair in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $pair
            mkdir -p "app/src/main/res/mipmap-$1"
            convert base.png -resize "$2x$2" "app/src/main/res/mipmap-$1/ic_launcher.png"
            cp "app/src/main/res/mipmap-$1/ic_launcher.png" \
               "app/src/main/res/mipmap-$1/ic_launcher_round.png"
          done
          rm -f base.png
          echo "Ikonkalar tayyor:"
          ls app/src/main/res/mipmap-*/

      - name: Imzo kalitini tiklash
        id: ks
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::KEYSTORE_BASE64 secret yo'q. Avval 'kalit' rejimida ishga tushiring."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"

      - name: Yig'ish
        working-directory: ${{ runner.temp }}/proj
        env:
          KEYSTORE_FILE:     ${{ steps.ks.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Fayllarni tayyorlash
        working-directory: ${{ runner.temp }}/proj
        run: |
          mkdir -p "$GITHUB_WORKSPACE/natija"
          cp app/build/outputs/apk/release/*.apk    "$GITHUB_WORKSPACE/natija/UnutilmasTam.apk"
          cp app/build/outputs/bundle/release/*.aab "$GITHUB_WORKSPACE/natija/UnutilmasTam.aab"
          ls -lh "$GITHUB_WORKSPACE/natija"

      - uses: actions/upload-artifact@v4
        with:
          name: UnutilmasTam-APK
          path: natija/
          retention-days: 30
